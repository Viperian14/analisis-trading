name: Datos reales del calendario

on:
  schedule:
    # Sondeo intensivo: una sola ejecución que arranca a las 12:10 UTC y comprueba cada 2 minutos hasta las 16:05 UTC
    # (cubre de 14:30 a 17:00 de España en verano y en invierno).
    - cron: '10 12 * * 1-5'
    # Segundo sondeo: FRED publica con retraso (la producción industrial llegó 5 h después), así que sigue comprobando de 16:10 a 20:05 UTC.
    - cron: '10 16 * * 1-5'
    # Resto del día laborable: cada 10 minutos, fuera de la ventana anterior.
    - cron: '*/10 0-11,20-23 * * 1-5'
  workflow_dispatch:
    inputs:
      sonda:
        description: 'Modo de prueba: lee los últimos datos y los guarda en sonda.json'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actuales
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar datos publicados
        env:
          BLS_KEY: ${{ secrets.BLS_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          EVENTO: ${{ github.event.schedule }}
          SONDA: ${{ inputs.sonda }}
        run: |
          git config user.name "CdB bot"
          git config user.email "actions@users.noreply.github.com"
          guardar() {
            git add -A actuales.json sonda.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Sin cambios"
            else
              git commit -q -m "Datos reales automáticos"
              git pull -q --rebase origin main || true
              git push -q origin HEAD:main || echo "No se pudo subir; se reintenta en la siguiente vuelta"
            fi
          }
          if [ "$SONDA" = "true" ]; then
            python scripts/actualizar_actuales.py --sonda || true
            guardar
          elif [ "$EVENTO" = "10 12 * * 1-5" ] || [ "$EVENTO" = "10 16 * * 1-5" ]; then
            if [ "$EVENTO" = "10 12 * * 1-5" ]; then FIN=1605; else FIN=2005; fi
            while [ "$((10#$(date -u +%H%M)))" -lt "$FIN" ]; do
              git pull -q --rebase origin main || true
              python scripts/actualizar_actuales.py || true
              guardar
              sleep 120
            done
          else
            python scripts/actualizar_actuales.py || true
            guardar
          fi
