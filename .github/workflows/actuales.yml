name: Datos reales del calendario

on:
  schedule:
    # Sondeo intensivo: una sola ejecución que arranca a las 12:10 UTC y comprueba cada 2 minutos hasta las 16:05 UTC
    # (cubre de 14:30 a 17:00 de España en verano y en invierno).
    - cron: '10 12 * * 1-5'
    # Sondeo de bonos y Fed: cada 5 minutos, pero solo actúa de 17:00 a 21:00 (hora de España) y solo los días con subasta de EE. UU. o decisión de la Fed.
    - cron: '*/5 14-19 * * 1-5'
    # Resto del día laborable: cada 10 minutos, fuera de la ventana anterior.
    - cron: '*/10 0-11,16-23 * * 1-5'
  workflow_dispatch:
    inputs:
      sonda:
        description: 'Modo de prueba: lee los últimos datos y los guarda en sonda.json'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actuales
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar datos publicados
        env:
          BLS_KEY: ${{ secrets.BLS_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          EVENTO: ${{ github.event.schedule }}
          SONDA: ${{ inputs.sonda }}
        run: |
          git config user.name "CdB bot"
          git config user.email "actions@users.noreply.github.com"
          guardar() {
            git add -A actuales.json sonda.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Sin cambios"
            else
              git commit -q -m "Datos reales automáticos"
              git pull -q --rebase origin main || true
              git push -q origin HEAD:main || echo "No se pudo subir; se reintenta en la siguiente vuelta"
            fi
          }
          if [ "$SONDA" = "true" ]; then
            python scripts/actualizar_actuales.py --sonda || true
            guardar
          elif [ "$EVENTO" = "*/5 14-19 * * 1-5" ]; then
            HM=$((10#$(TZ=Europe/Madrid date +%H%M)))
            if [ "$HM" -ge 1700 ] && [ "$HM" -lt 2100 ] && python scripts/actualizar_actuales.py --gate; then
              python scripts/actualizar_actuales.py || true
              guardar
            else
              echo "Fuera de ventana o sin subasta/Fed hoy"
            fi
          elif [ "$EVENTO" = "10 12 * * 1-5" ]; then
            while [ "$((10#$(date -u +%H%M)))" -lt 1605 ]; do
              git pull -q --rebase origin main || true
              python scripts/actualizar_actuales.py || true
              guardar
              sleep 120
            done
          else
            python scripts/actualizar_actuales.py || true
            guardar
          fi
