<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análisis por activo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con el nombre de la página, una fila de pestañas por activo y otra con las fechas
   de cada análisis (más reciente primero). Debajo, el análisis elegido: cotizaciones, conclusión,
   niveles (escala + tabla), escenarios, plan, lectura técnica, noticias y fuentes. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #12202c;
  --muted: #55656f;
  --line: #d6dde3;
  --accent: #0a6a86;
  --accent-soft: #dcebf0;
  --up: #16784a;
  --up-soft: #dcefe4;
  --flat: #8a6208;
  --flat-soft: #f4ead2;
  --down: #b3392c;
  --down-soft: #f6dedb;
  --band: rgba(10, 106, 134, 0.10);
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620; --surface: #152230; --fg: #e5ecf1; --muted: #9fb0bc; --line: #2a3a49;
    --accent: #5cc0dc; --accent-soft: #17323f; --up: #4cc58a; --up-soft: #153427;
    --flat: #e0b04c; --flat-soft: #3a2f15; --down: #ef7f70; --down-soft: #3b1f1c;
    --band: rgba(92, 192, 220, 0.12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1620; --surface: #152230; --fg: #e5ecf1; --muted: #9fb0bc; --line: #2a3a49;
  --accent: #5cc0dc; --accent-soft: #17323f; --up: #4cc58a; --up-soft: #153427;
  --flat: #e0b04c; --flat-soft: #3a2f15; --down: #ef7f70; --down-soft: #3b1f1c;
  --band: rgba(92, 192, 220, 0.12);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 28px 56px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.wrap > * { min-width: 0; }
#entry { margin: 0; width: 100%; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
section { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Navegación */
.nav { display: flex; flex-direction: column; gap: 14px; }
.nav .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navrow .lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; width: 64px; flex: none; }
.chip { font: inherit; font-size: 14px; font-weight: 500; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; line-height: 1.2; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip.date { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13px; }
.chip .new { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 6px; opacity: 0.85; }

/* Cabecera del análisis */
header { display: flex; flex-direction: column; gap: 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; color: var(--muted); }
.meta .when { color: var(--fg); font-weight: 600; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
.badge.old { background: var(--flat-soft); color: var(--flat); }
.quotes { display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: flex-end; }
.quote { display: flex; flex-direction: column; gap: 2px; }
.quote .lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.quote .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; line-height: 1.1; }
.quote .sub { font-size: 12px; color: var(--muted); }

.conclusion { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.conclusion .lead { font-size: 18px; font-weight: 600; line-height: 1.4; text-wrap: balance; }

.frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.frame { border-top: 2px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.frame .lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.frame .val { font-family: var(--font-num); font-weight: 600; font-size: 15px; }
.frame .note { font-size: 13px; color: var(--muted); }

/* Niveles */
.levels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 24px; align-items: start; }
.ladder { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.band { position: absolute; left: 0; right: 0; background: var(--band); }
.band span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--accent); font-weight: 500; }
.lv { position: absolute; left: 0; right: 0; transform: translateY(-50%); display: flex; align-items: center; gap: 10px; padding-inline: 12px; z-index: 1; }
.lv .p { width: 56px; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; flex: none; background: var(--surface); }
.lv .ln { flex: 1 1 24px; height: 0; border-top: 1px solid var(--line); min-width: 12px; }
.lv .t { font-size: 12.5px; color: var(--muted); text-align: right; max-width: 52%; line-height: 1.25; }
.lv.res .p { color: var(--down); } .lv.res .ln { border-top-color: var(--down); }
.lv.sup .p { color: var(--up); } .lv.sup .ln { border-top-color: var(--up); }
.lv.now .p { background: var(--accent); color: var(--surface); border-radius: 3px; padding: 1px 4px; width: auto; min-width: 56px; }
.lv.now .ln { border-top: 2px solid var(--accent); }
.lv.now .t { color: var(--accent); font-weight: 600; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.lvl { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
td.typ { color: var(--muted); min-width: 120px; }
td.cm { min-width: 200px; }

/* Escenarios */
.scen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sc { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sc .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sc .pct { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600; line-height: 1; }
.tag { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 3px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.sc.up .pct { color: var(--up); } .sc.up .tag { background: var(--up-soft); color: var(--up); } .sc.up .bar i { background: var(--up); }
.sc.flat .pct { color: var(--flat); } .sc.flat .tag { background: var(--flat-soft); color: var(--flat); } .sc.flat .bar i { background: var(--flat); }
.sc.down .pct { color: var(--down); } .sc.down .tag { background: var(--down-soft); color: var(--down); } .sc.down .bar i { background: var(--down); }
.sc p { color: var(--muted); font-size: 14px; }

/* Plan */
.plan { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pl { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.pl .k { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pl.wide { grid-column: 1 / -1; }

/* Filas de texto */
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.row .k { font-weight: 600; }
.row p { max-width: 70ch; }
.paras { display: flex; flex-direction: column; gap: 12px; max-width: 70ch; }
.paras .note { color: var(--muted); font-size: 14px; }

.dt td { min-width: 130px; }
.dt td:first-child { font-weight: 600; white-space: nowrap; min-width: 0; }
.dt td:last-child { min-width: 240px; }
section > .note { color: var(--muted); font-size: 14px; max-width: 75ch; }
.src { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.src li { font-size: 14px; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 820px) {
  .levels { grid-template-columns: minmax(0, 1fr); }
  .scen { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .frames { grid-template-columns: minmax(0, 1fr); }
  .plan { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .navrow .lbl { width: 100%; }
  .conclusion .lead { font-size: 17px; }
}
</style>

  function byAsset(a) { return entries.filter(function (e) { return e.asset === a; }); }
  function find(a, d) { return entries.filter(function (e) { return e.asset === a && e.date === d; })[0]; }

  // Deep link: #WTI-2026-10-04 o #WTI
  try {
    var h = (location.hash || '').replace('#', '');
    if (h) {
      var m = h.match(/^([A-Za-z0-9]+)(?:-(\d{4}-\d{2}-\d{2}))?$/);
      if (m && assets.indexOf(m[1]) >= 0) {
        state.asset = m[1];
        var list = byAsset(m[1]);
        state.date = (m[2] && find(m[1], m[2])) ? m[2] : list[0].date;
      }
    }
  } catch (e) {}

  function setHash() {
    try { history.replaceState(null, '', '#' + state.asset + '-' + state.date); } catch (e) {}
  }

  function renderNav() {
    var a = document.getElementById('assets');
    a.innerHTML = assets.map(function (x) {
      return '<button type="button" class="chip" data-asset="' + esc(x) + '" aria-pressed="' + (x === state.asset) + '">' + esc(ASSET_NAMES[x] || x) + '</button>';
    }).join('');
    var list = byAsset(state.asset);
    var d = document.getElementById('dates');
    d.innerHTML = list.map(function (e, i) {
      return '<button type="button" class="chip date" data-date="' + esc(e.date) + '" aria-pressed="' + (e.date === state.date) + '">' + shortDate(e.date) + (i === 0 ? '<span class="new">último</span>' : '') + '</button>';
    }).join('');
  }

  function ladder(e) {
    var lv = e.levels || [];
    if (!lv.length) return '';
    var ps = lv.map(function (l) { return l.p; });
    (e.bands || []).forEach(function (b) { ps.push(b.lo, b.hi); });
    var lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
    var pad = Math.max(2, 0.04 * (hi - lo));
    var min = Math.floor(lo - pad), max = Math.ceil(hi + pad);
    var range = max - min;
    var sorted = lv.map(function (l) { return l.p; }).sort(function (a, b) { return a - b; });
    var minGap = range;
    for (var i = 1; i < sorted.length; i++) { var g = sorted[i] - sorted[i - 1]; if (g > 0 && g < minGap) minGap = g; }
    var height = Math.min(1000, Math.max(560, Math.ceil(22 * range / minGap)));
    function top(p) { return ((max - p) / range) * 100; }
    var html = '<div class="ladder" style="height:' + height + 'px" role="img" aria-label="Escala de precios con resistencias y soportes">';
    (e.bands || []).forEach(function (b) {
      html += '<div class="band" style="top:' + top(b.hi) + '%;height:' + (top(b.lo) - top(b.hi)) + '%"><span>' + esc(b.label) + '</span></div>';
    });
    lv.forEach(function (l) {
      html += '<div class="lv ' + esc(l.cls) + '" style="top:' + top(l.p) + '%"><span class="p">' + (l.lbl || fmt(l.p)) + '</span><span class="ln"></span><span class="t">' + esc(l.t) + '</span></div>';
    });
    return html + '</div>';
  }

  function rows(list) {
    return '<div class="rows">' + list.map(function (r) {
      return '<div class="row"><span class="k">' + esc(r.k) + '</span><p>' + esc(r.text) + '</p></div>';
    }).join('') + '</div>';
  }
  function sec(id, title, body) {
    return '<section aria-labelledby="h-' + id + '"><h2 id="h-' + id + '">' + esc(title) + '</h2>' + body + '</section>';
  }

  function renderEntry() {
    var e = find(state.asset, state.date);
    var latest = byAsset(state.asset)[0].date === e.date;
    var out = '';

    out += '<header><h2 style="color:var(--fg);font-size:clamp(22px,4vw,30px);letter-spacing:-0.01em;text-transform:none;font-weight:600">' + esc(e.title) + '</h2>';
    out += '<div class="meta"><span class="when">' + esc(longDate(e.date)) + '</span>' +
      (e.operativa ? '<span>Operativa ' + esc(e.operativa.toLowerCase()) + '</span>' : '') +
      '<span class="badge' + (latest ? '' : ' old') + '">' + (latest ? 'Último análisis' : 'Análisis anterior') + '</span></div>';
    if (e.quotes && e.quotes.length) {
      out += '<div class="quotes">' + e.quotes.map(function (q) {
        return '<div class="quote"><span class="lbl">' + esc(q.l) + '</span><span class="val">' + esc(q.v) + '</span>' + (q.s ? '<span class="sub">' + esc(q.s) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    }
    out += '</header>';

    if (e.conclusion) {
      var c = '<div class="conclusion"><p class="lead">' + esc(e.conclusion.lead) + '</p>' + (e.conclusion.text ? '<p>' + esc(e.conclusion.text) + '</p>' : '') + '</div>';
      if (e.frames && e.frames.length) {
        c += '<div class="frames">' + e.frames.map(function (f) {
          return '<div class="frame"><span class="lbl">' + esc(f.l) + '</span><span class="val">' + esc(f.v) + '</span>' + (f.n ? '<span class="note">' + esc(f.n) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
      }
      out += sec('conc', 'Conclusión', c);
    }

    if (e.levels && e.levels.length) {
      var t = '<div class="levels">' + ladder(e);
      if (e.table && e.table.length) {
        t += '<div class="tablewrap"><table><thead><tr><th>Nivel</th><th>Tipo</th><th>Comentario</th></tr></thead><tbody>' +
          e.table.map(function (r) { return '<tr><td class="lvl">' + esc(r[0]) + '</td><td class="typ">' + esc(r[1]) + '</td><td class="cm">' + esc(r[2]) + '</td></tr>'; }).join('') +
          '</tbody></table></div>';
      }
      out += sec('niv', 'Niveles clave', t + '</div>');
    }

    if (e.scenarios && e.scenarios.length) {
      out += sec('esc', 'Escenarios', '<div class="scen">' + e.scenarios.map(function (s) {
        return '<article class="sc ' + esc(s.cls) + '"><span class="tag">' + esc(s.tag) + '</span><div class="top"><h3>' + esc(s.title) + '</h3><span class="pct">' + esc(s.pct) + '%</span></div><div class="bar" aria-hidden="true"><i style="width:' + Number(s.pct) + '%"></i></div><p>' + esc(s.text) + '</p></article>';
      }).join('') + '</div>');
    }

    if (e.plan && e.plan.length) {
      out += sec('plan', 'Qué haría', '<div class="plan">' + e.plan.map(function (p) {
        return '<div class="pl' + (p.wide ? ' wide' : '') + '"><span class="k">' + esc(p.k) + '</span><p>' + esc(p.text) + '</p></div>';
      }).join('') + '</div>');
    }

    if (e.tecnica && e.tecnica.length) out += sec('tec', 'Lectura técnica con el indicador', rows(e.tecnica));

    (e.tables || []).forEach(function (t, i) {
      var h = (t.intro ? '<p class="note">' + esc(t.intro) + '</p>' : '');
      h += '<div class="tablewrap"><table class="dt"><thead><tr>' + t.head.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        t.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>';
      if (t.note) h += '<p class="note">' + esc(t.note) + '</p>';
      out += sec('tb' + i, t.title, h);
    });

    if ((e.noticias && e.noticias.length) || e.extra) {
      var n = '';
      if (e.noticias && e.noticias.length) n += rows(e.noticias);
      if (e.extra) {
        n += '<h3 style="margin-top:8px">' + esc(e.extra.title) + '</h3><div class="paras">' +
          (e.extra.paras || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
          (e.extra.note ? '<p class="note">' + esc(e.extra.note) + '</p>' : '') + '</div>';
      }
      out += sec('not', 'Lo que dicen las noticias', n);
    }

    if (e.vigilar && e.vigilar.length) out += sec('vig', 'Qué vigilar', rows(e.vigilar));

    if (e.sources && e.sources.length) {
      out += sec('src', 'Fuentes', '<ul class="src">' + e.sources.map(function (s) {
        return '<li><a href="' + esc(s.u) + '" target="_blank" rel="noopener">' + esc(s.t) + '</a></li>';
      }).join('') + '</ul>');
    }

    document.getElementById('entry').innerHTML = out;
  }

  function render() { renderNav(); renderEntry(); setHash(); }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button.chip') : null;
    if (!b) return;
    if (b.getAttribute('data-asset')) {
      state.asset = b.getAttribute('data-asset');
      state.date = byAsset(state.asset)[0].date;
    } else if (b.getAttribute('data-date')) {
      state.date = b.getAttribute('data-date');
    }
    render();
  });

  render();
})();
</script>

</html>
